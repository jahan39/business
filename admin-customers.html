<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="The Sugar Atelier premium online cake shop. Fresh cakes and custom cakes.">
    <title>Customers | The Sugar Atelier</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="admin-side">
        <a class="logo" href="index.html">The Sugar <span>Atelier</span></a>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-products.html">Products</a>
        <a href="admin-categories.html">Categories</a>
        <a href="admin-orders.html">Orders</a>
        <a class="active" href="admin-customers.html">Customers</a>
        <a href="admin-reviews.html">Reviews</a>
        <a href="admin-coupons.html">Coupons</a>
        <a href="admin-custom-cakes.html">Custom Cakes</a>
        <a href="admin-messages.html">Messages</a>
        <a href="admin-payments.html">Payments</a>
        <a href="admin-settings.html">Settings</a>
        <a href="admin-login.html">Logout</a>
      </aside>
      <main class="admin-main">
        <div class="admin-top">
          <div>
            <span class="eyebrow">COMMUNITY</span>
            <h1>Registered Customers</h1>
          </div>
          <div style="display:flex;gap:10px;align-items:center;">
            <button class="theme-toggle-btn" id="adminThemeToggleBtn" type="button" aria-label="Toggle dark/light mode" title="Toggle dark/light mode" onclick="toggleTheme()">🌙</button>
            <a class="btn btn-outline" href="register.html" target="_blank">+ New Customer</a>
          </div>
        </div>
        <div class="admin-card">
          <div class="toolbar">
            <input id="adminCustomerSearch" placeholder="Search customers by name, email, or phone...">
            <span class="muted" id="customerCountBadge">Loading...</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Phone</th>
                  <th>Joined Date</th>
                  <th>Orders</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="adminCustomerRows">
                <tr>
                  <td colspan="6" style="text-align:center;padding:30px;color:var(--muted);">Loading customer database...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" class="toast"></div>

    <!-- Firebase SDK & Config -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
      (function() {
        const tbody = document.getElementById("adminCustomerRows");
        const countBadge = document.getElementById("customerCountBadge");
        const searchInput = document.getElementById("adminCustomerSearch");

        let customersList = [];

        function renderTable(list) {
          if (!list.length) {
            tbody.innerHTML = `
              <tr>
                <td colspan="6" style="text-align:center;padding:36px 16px;color:var(--muted);">
                  <div style="font-size:24px;margin-bottom:8px;">👥</div>
                  No registered customers yet. When users sign up, they appear here live.
                </td>
              </tr>
            `;
            if (countBadge) countBadge.textContent = "0 Customers";
            return;
          }

          if (countBadge) countBadge.textContent = `${list.length} Customer${list.length === 1 ? '' : 's'}`;

          tbody.innerHTML = list.map(c => {
            const name = c.name || "Member";
            const parts = name.split(" ");
            const initials = parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : name.slice(0, 2).toUpperCase();
            
            let dateStr = "Recent";
            if (c.createdAt && c.createdAt.toDate) {
              dateStr = c.createdAt.toDate().toLocaleDateString("en-US", { year: 'numeric', month: 'short', day: 'numeric' });
            } else if (c.createdAt && typeof c.createdAt === 'number') {
              dateStr = new Date(c.createdAt).toLocaleDateString("en-US", { year: 'numeric', month: 'short', day: 'numeric' });
            }

            return `
              <tr data-id="${c.id || ''}">
                <td>
                  <div style="display:flex;align-items:center;gap:12px;">
                    <div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0;">
                      ${initials}
                    </div>
                    <div>
                      <div style="font-weight:600;color:var(--dark,#2c1e21);">${name}</div>
                      <div style="font-size:12.5px;color:var(--muted,#756B6B);">${c.email || '—'}</div>
                    </div>
                  </div>
                </td>
                <td>${c.phone || "—"}</td>
                <td>${dateStr}</td>
                <td>${c.ordersCount || 0}</td>
                <td><span style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;background:rgba(39,174,96,0.12);color:#27ae60;">Active</span></td>
                <td>
                  <a href="mailto:${c.email || ''}" style="color:var(--primary);text-decoration:none;font-size:13px;font-weight:600;">Email ↗</a>
                </td>
              </tr>
            `;
          }).join("");
        }

        // Live Firestore listener
        if (window.db) {
          window.db.collection("customers").onSnapshot(snapshot => {
            customersList = [];
            snapshot.forEach(doc => {
              customersList.push({ id: doc.id, ...doc.data() });
            });
            renderTable(customersList);
          }, error => {
            console.warn("Firestore customers snapshot error:", error);
            renderTable([]);
          });
        } else {
          // Fallback demo row if offline
          const localUser = JSON.parse(localStorage.getItem("sugarAtelierCurrentUser") || "null");
          if (localUser) {
            customersList = [localUser];
          }
          renderTable(customersList);
        }

        // Search filtering
        searchInput?.addEventListener("input", e => {
          const q = e.target.value.toLowerCase().trim();
          const filtered = customersList.filter(c => 
            (c.name && c.name.toLowerCase().includes(q)) ||
            (c.email && c.email.toLowerCase().includes(q)) ||
            (c.phone && c.phone.includes(q))
          );
          renderTable(filtered);
        });
      })();
    </script>
  </body>
</html>
