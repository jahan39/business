<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="The Sugar Atelier premium online cake shop. Fresh cakes and custom cakes.">
    <title>Categories | The Sugar Atelier</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="admin-side">
        <a class="logo" href="index.html">The Sugar <span>Atelier</span></a>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-products.html">Products</a>
        <a class="active" href="admin-categories.html">Categories</a>
        <a href="admin-orders.html">Orders</a>
        <a href="admin-customers.html">Customers</a>
        <a href="admin-reviews.html">Reviews</a>
        <a href="admin-coupons.html">Coupons</a>
        <a href="admin-custom-cakes.html">Custom Cakes</a>
        <a href="admin-messages.html">Messages</a>
        <a href="admin-payments.html">Payments</a>
        <a href="admin-settings.html">Settings</a>
        <a href="admin-login.html">Logout</a>
      </aside>
      <main class="admin-main">
        <div class="admin-top">
          <div>
            <span class="eyebrow">ADMIN MANAGEMENT</span>
            <h1>Categories</h1>
          </div>
        </div>

        <!-- Add Category Form -->
        <div class="admin-card" style="margin-bottom:24px;">
          <h2 style="margin-bottom:16px;">Add New Category</h2>
          <form id="addCategoryForm" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
            <div>
              <label style="display:block;margin-bottom:4px;font-size:13px;font-weight:600;">Name</label>
              <input id="catName" type="text" placeholder="e.g. Birthday Cakes" required style="padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;min-width:200px;">
            </div>
            <div>
              <label style="display:block;margin-bottom:4px;font-size:13px;font-weight:600;">Description</label>
              <input id="catDesc" type="text" placeholder="Short description" style="padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;min-width:260px;">
            </div>
            <button type="submit" class="btn btn-primary" style="padding:10px 22px;">Add Category</button>
          </form>
        </div>

        <!-- Category List -->
        <div class="admin-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>Name</th>
                  <th>Description</th>
                  <th>Added</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="categoriesTbody">
                <tr><td colspan="5" style="text-align:center;padding:30px;color:var(--muted);">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <!-- Firebase SDK & Config -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
      (function() {
        const tbody = document.getElementById("categoriesTbody");
        const DEFAULT_CATS = [
          { name: "Birthday Cakes",   description: "For every birthday celebration" },
          { name: "Wedding Cakes",    description: "Elegant multi-tier cakes" },
          { name: "Cupcakes",         description: "Individual serving cupcakes" },
          { name: "Custom Cakes",     description: "Fully bespoke designs" },
        ];

        function renderCategories(list) {
          if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--muted);">No categories yet.</td></tr>';
            return;
          }
          tbody.innerHTML = list.map((c, i) => `
            <tr>
              <td>${i + 1}</td>
              <td><strong>${c.name || "—"}</strong></td>
              <td style="color:var(--muted);font-size:13px;">${c.description || "—"}</td>
              <td><small style="color:var(--muted);">${c.createdAt ? new Date(c.createdAt).toLocaleDateString("en-GB") : "—"}</small></td>
              <td>
                ${c._docId ? `<button class="btn btn-outline" style="font-size:12px;padding:5px 10px;color:#c0392b;border-color:#c0392b;" onclick="deleteCat('${c._docId}')">Delete</button>` : '<span style="color:var(--muted);font-size:12px;">Built-in</span>'}
              </td>
            </tr>`).join("");
        }

        window.deleteCat = async function(docId) {
          if (!window.db || !docId) return;
          if (!confirm("Delete this category?")) return;
          try { await window.db.collection("categories").doc(docId).delete(); toast("Category deleted."); }
          catch (err) { console.warn(err); }
        };

        document.getElementById("addCategoryForm")?.addEventListener("submit", async function(e) {
          e.preventDefault();
          const name = document.getElementById("catName").value.trim();
          const desc = document.getElementById("catDesc").value.trim();
          if (!name) return;
          if (window.db) {
            try {
              await window.db.collection("categories").add({ name, description: desc, createdAt: new Date().toISOString() });
              toast("Category '" + name + "' added!");
              this.reset();
            } catch (err) { console.warn(err); toast("Error saving category."); }
          }
        });

        if (window.db) {
          window.db.collection("categories").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            const list = [];
            snapshot.forEach(doc => list.push({ _docId: doc.id, ...doc.data() }));
            renderCategories(list.length ? list : DEFAULT_CATS);
          }, err => { console.warn(err); renderCategories(DEFAULT_CATS); });
        } else {
          renderCategories(DEFAULT_CATS);
        }
      })();
    </script>
  </body>
</html>
