<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="The Sugar Atelier premium online cake shop. Fresh cakes and custom cakes.">
    <title>Custom Cake Requests | The Sugar Atelier</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="admin-side">
        <a class="logo" href="index.html">The Sugar <span>Atelier</span></a>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-products.html">Products</a>
        <a href="admin-categories.html">Categories</a>
        <a href="admin-orders.html">Orders</a>
        <a href="admin-customers.html">Customers</a>
        <a href="admin-reviews.html">Reviews</a>
        <a href="admin-coupons.html">Coupons</a>
        <a class="active" href="admin-custom-cakes.html">Custom Cakes</a>
        <a href="admin-messages.html">Messages</a>
        <a href="admin-payments.html">Payments</a>
        <a href="admin-settings.html">Settings</a>
        <a href="admin-login.html">Logout</a>
      </aside>
      <main class="admin-main">
<div class="admin-top">
            <div>
              <span class="eyebrow">ADMIN MANAGEMENT</span>
              <h1>Custom Cake Requests</h1>
            </div>
          </div>
          <div class="admin-card">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Request ID</th>
                    <th>Photo</th>
                    <th>Customer</th>
                    <th>Cake Type & Flavor</th>
                    <th>Size & Date</th>
                    <th>Instructions / Message</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="customCakesTbody">
                  <tr>
                    <td colspan="8" style="text-align:center;padding:30px;color:var(--muted);">Loading requests…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
      </main>
    </div>
    <!-- Image Preview Modal -->
    <div id="imagePreviewModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:9999; align-items:center; justify-content:center; padding:20px;">
      <div style="position:relative; max-width:90vw; max-height:90vh; background:var(--surface, #1e1e24); border-radius:12px; overflow:hidden; box-shadow:0 20px 40px rgba(0,0,0,0.5); padding:12px; display:flex; flex-direction:column; align-items:center;">
        <button id="closeImgModalBtn" style="position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.6); color:#fff; border:none; width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;">✕</button>
        <img id="modalPreviewImg" src="" alt="Cake Reference" style="max-width:100%; max-height:80vh; object-fit:contain; border-radius:8px;">
      </div>
    </div>
    <div id="toast" class="toast"></div>
    <!-- Firebase SDK & Config -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
      (function() {
        const tbody = document.getElementById("customCakesTbody");
        const modal = document.getElementById("imagePreviewModal");
        const modalImg = document.getElementById("modalPreviewImg");
        const closeBtn = document.getElementById("closeImgModalBtn");

        function openModal(src) {
          if (!modal || !modalImg) return;
          modalImg.src = src;
          modal.style.display = "flex";
        }
        function closeModal() {
          if (modal) modal.style.display = "none";
          if (modalImg) modalImg.src = "";
        }
        closeBtn?.addEventListener("click", closeModal);
        modal?.addEventListener("click", e => { if (e.target === modal) closeModal(); });

        if (!tbody) return;

        const defaultItems = [
          { id: "CC-101", customerName: "Sadia Islam", phone: "+880 1819-234567", cakeType: "3-Tier Wedding Cake", flavor: "Vanilla & Raspberry", size: "3 KG+", deliveryDate: "2026-10-05", theme: "Floral Gold Elegance", message: "Forever & Always", instructions: "Less sweet cream, eggless base preferred.", status: "In Progress" }
        ];

        function renderCustomCakes(all) {
          if (!all.length) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--muted);">No custom cake requests yet.</td></tr>';
            return;
          }
          tbody.innerHTML = all.map(c => `
            <tr>
              <td><strong>${c.id}</strong></td>
              <td>
                ${c.image 
                  ? `<img src="${c.image}" alt="Ref" class="cake-thumb-preview" data-full="${c.image}" title="Click to view reference" style="width:44px;height:44px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--border);display:block;">` 
                  : `<span style="color:var(--muted);font-size:12px;">No photo</span>`}
              </td>
              <td>
                <b>${c.customerName || "—"}</b><br>
                <small style="color:var(--muted);">${c.phone || "No phone"}</small>
              </td>
              <td>
                <span>${c.cakeType || "—"}</span><br>
                <small style="color:var(--muted);">${c.flavor || ""}</small>
              </td>
              <td>
                <span>${c.size || "—"}</span><br>
                <small style="color:var(--primary);">${c.deliveryDate || "ASAP"}</small>
              </td>
              <td style="max-width:220px;font-size:13px;">
                ${c.message ? `<b>Msg:</b> "${c.message}"<br>` : ""}
                <span style="color:var(--muted);">${c.instructions || c.theme || "—"}</span>
              </td>
              <td>
                <span class="status ${c.status === 'Completed' ? 'success' : ''}">${c.status || "Pending"}</span>
              </td>
              <td>
                <select class="status-change-sel" data-id="${c.id}" style="padding:4px 8px;font-size:12px;border-radius:6px;border:1px solid var(--border);">
                  <option value="Pending"     ${c.status === 'Pending'     ? 'selected' : ''}>Pending</option>
                  <option value="In Progress" ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                  <option value="Completed"   ${c.status === 'Completed'   ? 'selected' : ''}>Completed</option>
                  <option value="Rejected"    ${c.status === 'Rejected'    ? 'selected' : ''}>Rejected</option>
                </select>
              </td>
            </tr>
          `).join("");

          tbody.querySelectorAll(".cake-thumb-preview").forEach(img => {
            img.addEventListener("click", () => openModal(img.dataset.full));
          });

          tbody.querySelectorAll(".status-change-sel").forEach(sel => {
            sel.addEventListener("change", async function() {
              const reqId    = this.dataset.id;
              const newStatus = this.value;
              if (window.db) {
                try { await window.db.collection("customCakeRequests").doc(reqId).update({ status: newStatus }); }
                catch (err) { console.warn("Firestore custom cake status note:", err); }
              }
              const list = JSON.parse(localStorage.getItem("sugarAtelierCustomCakes") || "[]");
              const target = list.find(item => item.id === reqId);
              if (target) { target.status = newStatus; localStorage.setItem("sugarAtelierCustomCakes", JSON.stringify(list)); }
              toast("Status updated to: " + newStatus);
            });
          });
        }

        if (window.db) {
          window.db.collection("customCakeRequests").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            const list = [];
            snapshot.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
            renderCustomCakes(list.length ? list : [...JSON.parse(localStorage.getItem("sugarAtelierCustomCakes") || "[]"), ...defaultItems]);
          }, err => {
            console.warn("Firestore custom cakes notice:", err);
            renderCustomCakes([...JSON.parse(localStorage.getItem("sugarAtelierCustomCakes") || "[]"), ...defaultItems]);
          });
        } else {
          renderCustomCakes([...JSON.parse(localStorage.getItem("sugarAtelierCustomCakes") || "[]"), ...defaultItems]);
        }
      })();
    </script>
  </body>
</html>
