<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="The Sugar Atelier premium online cake shop. Fresh cakes and custom cakes.">
    <title>Custom Cake Requests | The Sugar Atelier</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="admin-side">
        <a class="logo" href="index.html">The Sugar <span>Atelier</span></a>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-products.html">Products</a>
        <a href="admin-categories.html">Categories</a>
        <a href="admin-orders.html">Orders</a>
        <a href="admin-customers.html">Customers</a>
        <a href="admin-reviews.html">Reviews</a>
        <a href="admin-coupons.html">Coupons</a>
        <a class="active" href="admin-custom-cakes.html">Custom Cakes</a>
        <a href="admin-messages.html">Messages</a>
        <a href="admin-payments.html">Payments</a>
        <a href="admin-settings.html">Settings</a>
        <a href="admin-login.html">Logout</a>
      </aside>
      <main class="admin-main">
<div class="admin-top">
            <div>
              <span class="eyebrow">ADMIN MANAGEMENT</span>
              <h1>Custom Cake Requests</h1>
            </div>
          </div>
          <div class="admin-card">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Request ID</th>
                    <th>Customer</th>
                    <th>Cake Type & Flavor</th>
                    <th>Size & Date</th>
                    <th>Instructions / Message</th>
                    <th>Status</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="customCakesTbody">
                  <tr>
                    <td colspan="7" style="text-align:center;padding:30px;color:var(--muted);">Loading requests…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
    <script>
      (function() {
        const tbody = document.getElementById("customCakesTbody");
        if (!tbody) return;

        function renderCustomCakes() {
          const defaultItems = [
            {
              id: "CC-101",
              customerName: "Sadia Islam",
              phone: "+880 1819-234567",
              cakeType: "3-Tier Wedding Cake",
              flavor: "Vanilla & Raspberry",
              size: "3 KG+",
              deliveryDate: "2026-10-05",
              theme: "Floral Gold Elegance",
              message: "Forever & Always",
              instructions: "Less sweet cream, eggless base preferred.",
              status: "In Progress"
            }
          ];

          const saved = JSON.parse(localStorage.getItem("sugarAtelierCustomCakes") || "[]");
          const all = [...saved, ...defaultItems];

          if (!all.length) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted);">No custom cake requests received yet.</td></tr>';
            return;
          }

          tbody.innerHTML = all.map((c, i) => `
            <tr>
              <td><strong>${c.id}</strong></td>
              <td>
                <b>${c.customerName}</b><br>
                <small style="color:var(--muted);">${c.phone || "No phone"}</small>
              </td>
              <td>
                <span>${c.cakeType}</span><br>
                <small style="color:var(--muted);">${c.flavor}</small>
              </td>
              <td>
                <span>${c.size}</span><br>
                <small style="color:var(--primary);">${c.deliveryDate || "ASAP"}</small>
              </td>
              <td style="max-width:220px;font-size:13px;">
                ${c.message ? `<b>Msg:</b> "${c.message}"<br>` : ""}
                <span style="color:var(--muted);">${c.instructions || c.theme || "—"}</span>
              </td>
              <td>
                <span class="status ${c.status === 'Completed' ? 'success' : ''}">${c.status}</span>
              </td>
              <td>
                <select class="status-change-sel" data-id="${c.id}" style="padding:4px 8px;font-size:12px;border-radius:6px;border:1px solid var(--border);">
                  <option value="Pending" ${c.status === 'Pending' ? 'selected' : ''}>Pending</option>
                  <option value="In Progress" ${c.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                  <option value="Completed" ${c.status === 'Completed' ? 'selected' : ''}>Completed</option>
                  <option value="Rejected" ${c.status === 'Rejected' ? 'selected' : ''}>Rejected</option>
                </select>
              </td>
            </tr>
          `).join("");

          tbody.querySelectorAll(".status-change-sel").forEach(sel => {
            sel.addEventListener("change", function() {
              const reqId = this.dataset.id;
              const newStatus = this.value;
              const list = JSON.parse(localStorage.getItem("sugarAtelierCustomCakes") || "[]");
              const target = list.find(item => item.id === reqId);
              if (target) {
                target.status = newStatus;
                localStorage.setItem("sugarAtelierCustomCakes", JSON.stringify(list));
              }
              toast("Status updated to: " + newStatus);
              renderCustomCakes();
            });
          });
        }

        renderCustomCakes();
      })();
    </script>
  </body>
</html>
