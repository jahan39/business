<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="The Sugar Atelier executive admin portal. Manage catalog, orders, and customer operations.">
    <title>Executive Admin Portal | The Sugar Atelier</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
      /* ── Luxury Admin Login Theme ── */
      body.admin-login-body {
        margin: 0;
        min-height: 100vh;
        background: 
          radial-gradient(circle at 12% 18%, rgba(139, 58, 98, 0.14) 0%, transparent 42%),
          radial-gradient(circle at 88% 82%, rgba(217, 154, 171, 0.18) 0%, transparent 45%),
          radial-gradient(circle at 50% 50%, rgba(247, 214, 224, 0.25) 0%, transparent 60%),
          linear-gradient(135deg, #fbf4f6 0%, #fff9f8 50%, #f8eaef 100%);
        display: grid;
        place-items: center;
        padding: 24px 16px;
        position: relative;
        overflow-x: hidden;
      }

      /* Ambient floating luxury orbs */
      .ambient-orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(60px);
        pointer-events: none;
        z-index: 0;
        opacity: 0.6;
      }
      .orb-1 {
        width: 320px;
        height: 320px;
        background: #F7D6E0;
        top: -60px;
        left: -60px;
        animation: floatOrb 12s ease-in-out infinite alternate;
      }
      .orb-2 {
        width: 380px;
        height: 380px;
        background: rgba(139, 58, 98, 0.16);
        bottom: -90px;
        right: -80px;
        animation: floatOrb 15s ease-in-out infinite alternate-reverse;
      }
      @keyframes floatOrb {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, 40px) scale(1.08); }
      }

      /* Glassmorphic card container */
      .admin-login-card {
        width: 100%;
        max-width: 450px;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(26px);
        -webkit-backdrop-filter: blur(26px);
        border: 1.5px solid rgba(255, 255, 255, 0.95);
        border-radius: 26px;
        box-shadow: 
          0 24px 60px rgba(88, 25, 54, 0.12),
          0 6px 18px rgba(0, 0, 0, 0.03),
          inset 0 1px 1px rgba(255, 255, 255, 0.95);
        padding: 38px 36px 32px;
        position: relative;
        z-index: 2;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        animation: cardFadeIn 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      @keyframes cardFadeIn {
        from {
          opacity: 0;
          transform: translateY(22px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }

      /* Top emblem badge */
      .admin-top-badge {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .emblem-wrapper {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .emblem-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: linear-gradient(135deg, #8B3A62 0%, #a84877 100%);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 20px;
        box-shadow: 0 6px 16px rgba(139, 58, 98, 0.28);
      }

      .console-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(139, 58, 98, 0.08);
        color: var(--primary, #8B3A62);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(139, 58, 98, 0.16);
      }

      .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #27ae60;
        box-shadow: 0 0 8px rgba(39, 174, 96, 0.7);
        animation: pulseDot 2s infinite;
      }
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.85); }
      }

      /* Card Title Section */
      .card-header-text {
        margin-bottom: 22px;
      }
      .card-header-text h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-size: 27px;
        font-weight: 700;
        color: var(--dark, #2b2023);
        margin: 0 0 6px;
        letter-spacing: -0.3px;
      }
      .card-header-text p {
        color: var(--muted, #756B6B);
        font-size: 13.5px;
        line-height: 1.5;
        margin: 0;
      }

      /* Demo Access Interactive Box */
      .demo-credentials-banner {
        background: linear-gradient(135deg, #fff5f8 0%, #faedf2 100%);
        border: 1.5px dashed rgba(139, 58, 98, 0.28);
        border-radius: 14px;
        padding: 11px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 22px;
        gap: 10px;
      }
      .demo-text {
        font-size: 12.5px;
        color: #4a2434;
        line-height: 1.4;
      }
      .demo-text strong {
        color: var(--primary, #8B3A62);
        font-family: monospace;
        font-size: 13px;
      }
      .btn-autofill {
        background: #fff;
        border: 1px solid rgba(139, 58, 98, 0.25);
        color: var(--primary, #8B3A62);
        font-size: 11.5px;
        font-weight: 700;
        padding: 5px 11px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
        box-shadow: 0 2px 6px rgba(139, 58, 98, 0.08);
      }
      .btn-autofill:hover {
        background: var(--primary, #8B3A62);
        color: #fff;
        border-color: var(--primary, #8B3A62);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(139, 58, 98, 0.2);
      }

      /* Form inputs with inside icons */
      .input-group {
        margin-bottom: 18px;
      }
      .input-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #52474a;
        margin-bottom: 7px;
      }
      .input-field-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }
      .input-icon {
        position: absolute;
        left: 14px;
        color: #9d838d;
        pointer-events: none;
        transition: color 0.2s;
      }
      .admin-input {
        width: 100%;
        padding: 13px 14px 13px 44px;
        border: 1.5px solid #eadede;
        border-radius: 12px;
        background: #fdfafb;
        font-size: 14.5px;
        font-weight: 500;
        color: #2b2023;
        outline: none;
        transition: all 0.22s ease;
      }
      .admin-input:focus {
        border-color: var(--primary, #8B3A62);
        background: #ffffff;
        box-shadow: 0 0 0 4px rgba(139, 58, 98, 0.12);
      }
      .admin-input:focus + .input-icon,
      .input-field-wrapper:focus-within .input-icon {
        color: var(--primary, #8B3A62);
      }

      /* Eye password toggle button */
      .pw-toggle-btn {
        position: absolute;
        right: 12px;
        background: none;
        border: none;
        color: #9d838d;
        cursor: pointer;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 6px;
        transition: color 0.2s, background-color 0.2s;
      }
      .pw-toggle-btn:hover {
        color: var(--primary, #8B3A62);
        background: rgba(139, 58, 98, 0.07);
      }

      /* Remember me checkbox row */
      .form-meta-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 6px 0 22px;
        font-size: 13px;
        color: #63585b;
      }
      .remember-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
        margin: 0;
        font-weight: 500;
      }
      .remember-label input[type="checkbox"] {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--primary, #8B3A62);
        cursor: pointer;
      }
      .secure-notice {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #8c7f83;
        font-size: 12px;
      }

      /* Submit button with luxury glow */
      .btn-submit-luxury {
        width: 100%;
        padding: 14px 20px;
        background: linear-gradient(135deg, #8B3A62 0%, #a24171 60%, #8B3A62 100%);
        background-size: 200% auto;
        color: #ffffff;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.3px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(139, 58, 98, 0.28);
        transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-submit-luxury:hover {
        background-position: right center;
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(139, 58, 98, 0.38);
      }
      .btn-submit-luxury:active {
        transform: translateY(0) scale(0.99);
      }

      /* Card footer navigation */
      .card-footer-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid #f0e6e8;
      }
      .footer-nav-link {
        font-size: 13px;
        font-weight: 600;
        color: #6d6165;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        transition: color 0.2s;
        text-decoration: none;
      }
      .footer-nav-link:hover {
        color: var(--primary, #8B3A62);
      }
      .footer-nav-link.highlight {
        color: var(--primary, #8B3A62);
      }

      .card-bottom-legal {
        margin: 16px 0 0;
        text-align: center;
        font-size: 11.5px;
        color: #9c8e92;
        letter-spacing: 0.2px;
      }

      /* Mobile adjustments */
      @media (max-width: 480px) {
        .admin-login-card {
          padding: 28px 22px 24px;
          border-radius: 20px;
        }
        .card-header-text h1 {
          font-size: 24px;
        }
        .demo-credentials-banner {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }
        .btn-autofill {
          align-self: flex-start;
        }
      }
    </style>
  </head>
  <body class="admin-login-body">
    <!-- Ambient glowing shapes -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <main>
      <form class="admin-login-card" id="adminLoginForm">
        <!-- Top emblem bar -->
        <div class="admin-top-badge">
          <div class="emblem-wrapper">
            <div class="emblem-icon">🧁</div>
            <a class="logo" href="index.html" style="font-size:20px;">The Sugar <span>Atelier</span></a>
          </div>
          <span class="console-pill">
            <span class="status-dot"></span>
            PORTAL
          </span>
        </div>

        <!-- Header text -->
        <div class="card-header-text">
          <h1>Executive Sign In</h1>
          <p>Access your bakery management console, catalog management, and order fulfillment.</p>
        </div>

        <!-- Interactive Demo Credentials Banner -->
        <div class="demo-credentials-banner" id="demoBanner">
          <div class="demo-text">
            <span>🔑 Demo Access:</span>
            <strong>admin</strong> / <strong>12345</strong>
          </div>
          <button type="button" class="btn-autofill" id="autoFillBtn" title="Fill credentials into form">
            Auto-Fill ⚡
          </button>
        </div>

        <!-- Username field -->
        <div class="input-group">
          <label class="input-label" for="adminUser">
            <span>Username</span>
            <span style="color:#a8999d;font-weight:500;text-transform:none;">Staff ID</span>
          </label>
          <div class="input-field-wrapper">
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input 
              class="admin-input" 
              id="adminUser" 
              name="adminUser" 
              value="admin" 
              placeholder="Enter username" 
              required 
              autocomplete="username">
          </div>
        </div>

        <!-- Password field -->
        <div class="input-group">
          <label class="input-label" for="adminPass">
            <span>Password</span>
            <span style="color:#a8999d;font-weight:500;text-transform:none;">Security key</span>
          </label>
          <div class="input-field-wrapper">
            <svg class="input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input 
              class="admin-input" 
              type="password" 
              id="adminPass" 
              name="adminPass" 
              value="12345" 
              placeholder="Enter password" 
              required 
              autocomplete="current-password">
            <button type="button" class="pw-toggle-btn" id="pwToggle" aria-label="Toggle password visibility">
              <svg id="eyeIcon" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Checkbox & Security notice -->
        <div class="form-meta-row">
          <label class="remember-label">
            <input type="checkbox" checked id="rememberAdmin">
            <span>Keep session active</span>
          </label>
          <span class="secure-notice">
            <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            SSL Secure
          </span>
        </div>

        <!-- Submit Button -->
        <button class="btn-submit-luxury" id="adminLoginBtn" type="submit">
          <span>Authorize & Enter Console</span>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path d="M5 12h14M12 5l7 7-7 7"></path>
          </svg>
        </button>

        <!-- Navigation Links -->
        <div class="card-footer-nav">
          <a class="footer-nav-link" href="index.html">
            ← Storefront
          </a>
          <a class="footer-nav-link highlight" href="shop.html">
            Live Shop ↗
          </a>
        </div>

        <p class="card-bottom-legal">
          The Sugar Atelier Management Portal • Restricted Authorized Access
        </p>
      </form>
    </main>

    <div id="toast" class="toast"></div>

    <script src="js/app.js"></script>
    <script>
      // ── Interactive UI Enhancements ──
      (function() {
        const userInp = document.getElementById("adminUser");
        const passInp = document.getElementById("adminPass");
        const autoFillBtn = document.getElementById("autoFillBtn");
        const pwToggle = document.getElementById("pwToggle");
        const eyeIcon = document.getElementById("eyeIcon");

        // Auto-Fill Helper
        autoFillBtn?.addEventListener("click", () => {
          if (userInp) userInp.value = "admin";
          if (passInp) passInp.value = "12345";
          autoFillBtn.textContent = "Filled ✓";
          setTimeout(() => { autoFillBtn.textContent = "Auto-Fill ⚡"; }, 1400);
        });

        // Password Show / Hide toggle
        let isShown = false;
        pwToggle?.addEventListener("click", () => {
          isShown = !isShown;
          if (passInp) {
            passInp.type = isShown ? "text" : "password";
          }
          if (eyeIcon) {
            eyeIcon.innerHTML = isShown
              ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
              : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
          }
        });
      })();
    </script>
  </body>
</html>
