<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="The Sugar Atelier premium online cake shop. Fresh cakes and custom cakes.">
    <title>Payments | The Sugar Atelier</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="admin-side">
        <a class="logo" href="index.html">The Sugar <span>Atelier</span></a>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-products.html">Products</a>
        <a href="admin-categories.html">Categories</a>
        <a href="admin-orders.html">Orders</a>
        <a href="admin-customers.html">Customers</a>
        <a href="admin-reviews.html">Reviews</a>
        <a href="admin-coupons.html">Coupons</a>
        <a href="admin-custom-cakes.html">Custom Cakes</a>
        <a href="admin-messages.html">Messages</a>
        <a class="active" href="admin-payments.html">Payments</a>
        <a href="admin-settings.html">Settings</a>
        <a href="admin-login.html">Logout</a>
      </aside>
      <main class="admin-main">
        <div class="admin-top">
          <div>
            <span class="eyebrow">ADMIN MANAGEMENT</span>
            <h1>Payments</h1>
          </div>
        </div>

        <!-- Summary Stats -->
        <div class="stats" style="margin-bottom:24px;">
          <div><span>Total Revenue</span><b id="payTotalRevenue">—</b></div>
          <div><span>Transactions</span><b id="payTotalCount">—</b></div>
          <div><span>bKash / Nagad</span><b id="payBkashCount">—</b></div>
          <div><span>Card / Other</span><b id="payCardCount">—</b></div>
        </div>

        <!-- Payment Table -->
        <div class="admin-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Amount</th>
                  <th>Method</th>
                  <th>Status</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="paymentsTbody">
                <tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted);">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <!-- Firebase SDK & Config -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
      (function() {
        const tbody = document.getElementById("paymentsTbody");

        function renderPayments(orders) {
          // Update summary
          const total   = orders.reduce((s, o) => s + (o.totalAmount || 0), 0);
          const bkash   = orders.filter(o => (o.paymentMethod || "").toLowerCase().includes("bkash") || (o.paymentMethod || "").toLowerCase().includes("nagad")).length;
          const card    = orders.length - bkash;

          const el = id => document.getElementById(id);
          if (el("payTotalRevenue")) el("payTotalRevenue").textContent = "৳" + total.toLocaleString("en-IN");
          if (el("payTotalCount"))   el("payTotalCount").textContent   = orders.length;
          if (el("payBkashCount"))   el("payBkashCount").textContent   = bkash;
          if (el("payCardCount"))    el("payCardCount").textContent    = card;

          if (!orders.length) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted);">No payment records yet.</td></tr>';
            return;
          }

          tbody.innerHTML = orders.map(o => `
            <tr>
              <td><strong>${o.id || "—"}</strong></td>
              <td>
                <b>${o.customerName || "—"}</b><br>
                <small style="color:var(--muted);">${o.customerPhone || ""}</small>
              </td>
              <td><strong style="color:var(--primary);">${o.total || "—"}</strong></td>
              <td><small>${o.paymentMethod || "—"}</small></td>
              <td><span class="status ${o.status === 'Delivered' ? 'success' : ''}">${o.status || "—"}</span></td>
              <td><small style="color:var(--muted);">${o.date || "—"}</small></td>
            </tr>`).join("");
        }

        if (window.db) {
          window.db.collection("orders").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            const orders = [];
            snapshot.forEach(doc => orders.push({ id: doc.id, ...doc.data() }));
            renderPayments(orders);
          }, err => { console.warn("Firestore payments notice:", err); renderPayments([]); });
        } else {
          renderPayments([]);
        }
      })();
    </script>
  </body>
</html>
