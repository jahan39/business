<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="The Sugar Atelier premium online cake shop. Fresh cakes and custom cakes.">
    <title>Orders | The Sugar Atelier</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="admin-side">
        <a class="logo" href="index.html">The Sugar <span>Atelier</span></a>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-products.html">Products</a>
        <a href="admin-categories.html">Categories</a>
        <a class="active" href="admin-orders.html">Orders</a>
        <a href="admin-customers.html">Customers</a>
        <a href="admin-reviews.html">Reviews</a>
        <a href="admin-coupons.html">Coupons</a>
        <a href="admin-custom-cakes.html">Custom Cakes</a>
        <a href="admin-messages.html">Messages</a>
        <a href="admin-payments.html">Payments</a>
        <a href="admin-settings.html">Settings</a>
        <a href="admin-login.html">Logout</a>
      </aside>
      <main class="admin-main">
<div class="admin-top">
            <div>
              <span class="eyebrow">ADMIN MANAGEMENT</span>
              <h1>Orders</h1>
            </div>
          </div>
          <div class="admin-card">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Current Status</th>
                    <th>Update Status</th>
                  </tr>
                </thead>
                <tbody id="adminOrdersTbody">
                  <tr>
                    <td colspan="6" style="text-align:center;padding:30px;color:var(--muted);">Loading orders…</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script src="js/app.js"></script>
    <script>
      (function() {
        const tbody = document.getElementById("adminOrdersTbody");
        if (!tbody) return;

        function renderAdminOrders() {
          const defaultOrders = [
            { id: "#SC-1024", date: "14 Sep 2026", total: "৳ 1,950", status: "Delivered", items: [{ name: "Classic Chocolate Dream", qty: 1 }] },
            { id: "#SC-1019", date: "08 Sep 2026", total: "৳ 2,050", status: "Baking", items: [{ name: "Strawberry Velvet", qty: 1 }] }
          ];

          const saved = JSON.parse(localStorage.getItem("sugarAtelierOrders") || "[]");
          const all = [...saved, ...defaultOrders];

          tbody.innerHTML = all.map(o => {
            const itemsStr = o.items && o.items.length
              ? o.items.map(i => `${i.name} (x${i.qty})`).join(", ")
              : "Handcrafted Cake";

            return `
              <tr>
                <td><strong>${o.id}</strong></td>
                <td>${o.date || "Recent"}</td>
                <td style="max-width:260px;font-size:13px;color:var(--muted);">${itemsStr}</td>
                <td><strong style="color:var(--primary);">${o.total}</strong></td>
                <td>
                  <span class="status ${o.status === 'Delivered' ? 'success' : ''}">${o.status}</span>
                </td>
                <td>
                  <select class="admin-status-sel" data-id="${o.id}" style="padding:5px 9px;font-size:12px;border-radius:6px;border:1px solid var(--border);">
                    <option value="Order Placed" ${o.status === 'Order Placed' ? 'selected' : ''}>Order Placed</option>
                    <option value="Confirmed" ${o.status === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                    <option value="Baking" ${o.status === 'Baking' ? 'selected' : ''}>Baking</option>
                    <option value="Out for Delivery" ${o.status === 'Out for Delivery' ? 'selected' : ''}>Out for Delivery</option>
                    <option value="Delivered" ${o.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
                  </select>
                </td>
              </tr>
            `;
          }).join("");

          tbody.querySelectorAll(".admin-status-sel").forEach(sel => {
            sel.addEventListener("change", function() {
              const orderId = this.dataset.id;
              const newStatus = this.value;
              const list = JSON.parse(localStorage.getItem("sugarAtelierOrders") || "[]");
              let target = list.find(item => item.id === orderId);
              if (target) {
                target.status = newStatus;
                localStorage.setItem("sugarAtelierOrders", JSON.stringify(list));
              } else {
                // If it was one of the default orders, add to localStorage to persist change
                const base = defaultOrders.find(d => d.id === orderId);
                if (base) {
                  list.push({ ...base, status: newStatus });
                  localStorage.setItem("sugarAtelierOrders", JSON.stringify(list));
                }
              }
              toast("Order " + orderId + " updated to: " + newStatus);
              renderAdminOrders();
            });
          });
        }

        renderAdminOrders();
      })();
    </script>
  </body>
</html>
