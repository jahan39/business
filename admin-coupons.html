<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="description" content="The Sugar Atelier premium online cake shop. Fresh cakes and custom cakes.">
    <title>Coupons | The Sugar Atelier</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body class="admin-body">
    <div class="admin-layout">
      <aside class="admin-side">
        <a class="logo" href="index.html">The Sugar <span>Atelier</span></a>
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-products.html">Products</a>
        <a href="admin-categories.html">Categories</a>
        <a href="admin-orders.html">Orders</a>
        <a href="admin-customers.html">Customers</a>
        <a href="admin-reviews.html">Reviews</a>
        <a class="active" href="admin-coupons.html">Coupons</a>
        <a href="admin-custom-cakes.html">Custom Cakes</a>
        <a href="admin-messages.html">Messages</a>
        <a href="admin-payments.html">Payments</a>
        <a href="admin-settings.html">Settings</a>
        <a href="admin-login.html">Logout</a>
      </aside>
      <main class="admin-main">
        <div class="admin-top">
          <div>
            <span class="eyebrow">ADMIN MANAGEMENT</span>
            <h1>Coupons</h1>
          </div>
        </div>

        <!-- Add Coupon Form -->
        <div class="admin-card" style="margin-bottom:24px;">
          <h2 style="margin-bottom:16px;">Add New Coupon</h2>
          <form id="addCouponForm" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;">
            <div>
              <label style="display:block;margin-bottom:4px;font-size:13px;font-weight:600;">Code</label>
              <input id="couponCode" type="text" placeholder="SAVE10" required style="padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;min-width:140px;">
            </div>
            <div>
              <label style="display:block;margin-bottom:4px;font-size:13px;font-weight:600;">Discount %</label>
              <input id="couponDiscount" type="number" min="1" max="100" placeholder="10" required style="padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;width:100px;">
            </div>
            <div>
              <label style="display:block;margin-bottom:4px;font-size:13px;font-weight:600;">Expiry Date</label>
              <input id="couponExpiry" type="date" required style="padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;">
            </div>
            <button type="submit" class="btn btn-primary" style="padding:10px 22px;">Add Coupon</button>
          </form>
        </div>

        <!-- Coupon List -->
        <div class="admin-card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Code</th>
                  <th>Discount</th>
                  <th>Expiry</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="couponsTbody">
                <tr><td colspan="5" style="text-align:center;padding:30px;color:var(--muted);">Loading…</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <!-- Firebase SDK & Config -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/app.js"></script>
    <script>
      (function() {
        const tbody = document.getElementById("couponsTbody");

        function renderCoupons(list) {
          if (!list.length) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--muted);">No coupons yet.</td></tr>';
            return;
          }
          const now = new Date();
          tbody.innerHTML = list.map(c => {
            const exp = c.expiry ? new Date(c.expiry) : null;
            const expired = exp && exp < now;
            return `
              <tr>
                <td><strong style="letter-spacing:1px;font-family:monospace;">${c.code || "—"}</strong></td>
                <td><b style="color:var(--primary);">${c.discount || 0}% OFF</b></td>
                <td>${c.expiry || "—"}</td>
                <td><span class="status ${!expired ? 'success' : ''}">${expired ? 'Expired' : 'Active'}</span></td>
                <td>
                  <button class="btn btn-outline" style="font-size:12px;padding:5px 10px;color:#c0392b;border-color:#c0392b;" onclick="deleteCoupon('${c._docId}')">Delete</button>
                </td>
              </tr>`;
          }).join("");
        }

        window.deleteCoupon = async function(docId) {
          if (!window.db || !docId) return;
          if (!confirm("Delete this coupon?")) return;
          try { await window.db.collection("coupons").doc(docId).delete(); toast("Coupon deleted."); }
          catch (err) { console.warn(err); }
        };

        // Add coupon
        document.getElementById("addCouponForm")?.addEventListener("submit", async function(e) {
          e.preventDefault();
          const code     = document.getElementById("couponCode").value.trim().toUpperCase();
          const discount = Number(document.getElementById("couponDiscount").value);
          const expiry   = document.getElementById("couponExpiry").value;
          if (!code || !discount || !expiry) return;
          if (window.db) {
            try {
              await window.db.collection("coupons").doc(code).set({ code, discount, expiry, createdAt: new Date().toISOString() });
              toast("Coupon '" + code + "' added!");
              this.reset();
            } catch (err) { console.warn(err); toast("Error saving coupon."); }
          }
        });

        // Real-time list
        if (window.db) {
          window.db.collection("coupons").orderBy("createdAt", "desc").onSnapshot(snapshot => {
            const list = [];
            snapshot.forEach(doc => list.push({ _docId: doc.id, ...doc.data() }));
            renderCoupons(list);
          }, err => { console.warn(err); renderCoupons([]); });
        } else {
          renderCoupons([]);
        }
      })();
    </script>
  </body>
</html>
